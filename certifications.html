<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Certifications | Tanweer Ansari</title>

<style>

/* ================================
   RESET
================================ */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    color: #ffffff;

    background:
        radial-gradient(circle at 10% 15%, rgba(0,180,255,.16), transparent 30%),
        radial-gradient(circle at 90% 75%, rgba(125,70,255,.18), transparent 35%),
        linear-gradient(135deg, #031526, #071b32, #10153b);

    overflow-x: hidden;
}


/* ================================
   NAVIGATION
================================ */

.top-nav {
    width: 100%;
    min-height: 72px;

    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;

    padding: 12px 5%;

    background: rgba(3, 14, 28, .88);
    border-bottom: 1px solid rgba(0, 190, 255, .25);

    backdrop-filter: blur(16px);

    position: sticky;
    top: 0;
    z-index: 1000;
}

.top-nav a {
    color: #c4d8ea;
    text-decoration: none;

    font-size: 14px;
    font-weight: 700;

    padding: 10px 14px;

    border-radius: 10px;

    transition: .3s ease;
}

.top-nav a:hover,
.top-nav a.active {
    color: #ffffff;

    background:
        linear-gradient(
            135deg,
            #008cff,
            #734dff
        );

    transform: translateY(-2px);

    box-shadow:
        0 0 20px rgba(0, 160, 255, .45);
}


/* ================================
   WHATSAPP
================================ */

.whatsapp-btn {
    color: #ffffff !important;

    background:
        linear-gradient(
            135deg,
            #00c853,
            #009b62
        ) !important;

    padding: 11px 17px !important;

    box-shadow:
        0 0 18px rgba(0, 210, 110, .25);
}

.whatsapp-btn:hover {
    background:
        linear-gradient(
            135deg,
            #00e676,
            #00a86b
        ) !important;

    box-shadow:
        0 0 28px rgba(0, 230, 120, .55) !important;
}


/* ================================
   THEME BUTTON
================================ */

.theme-btn {
    width: 45px;
    height: 45px;

    border: 1px solid rgba(0,190,255,.4);

    border-radius: 11px;

    background: rgba(8,30,52,.95);

    color: white;

    font-size: 19px;

    cursor: pointer;

    transition: .35s ease;
}

.theme-btn:hover {
    transform: rotate(12deg) scale(1.08);

    box-shadow:
        0 0 22px rgba(0,190,255,.55);
}


/* ================================
   PAGE HEADER
================================ */

.page-header {
    text-align: center;

    max-width: 900px;

    margin: 0 auto;

    padding:
        65px 20px
        45px;
}

.page-label {
    color: #00c6ff;

    font-size: 13px;

    font-weight: 800;

    letter-spacing: 5px;

    margin-bottom: 17px;
}

.page-header h1 {
    font-size:
        clamp(40px, 6vw, 68px);

    line-height: 1.08;

    margin-bottom: 18px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #6bd5ff,
            #9c70ff,
            #ffffff
        );

    background-size: 300%;

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    animation: titleMove 7s linear infinite;
}

.page-header p {
    color: #aac5dd;

    font-size: 16px;

    line-height: 1.7;
}


/* ================================
   CERTIFICATE GRID
================================ */

.certificate-grid {

    width: min(1180px, 92%);

    margin: 0 auto 65px;

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 30px;
}


/* ================================
   CERTIFICATE CARD
================================ */

.certificate-card {

    position: relative;

    height: 410px;

    padding: 9px;

    border-radius: 20px;

    background: #ffffff;

    border: 2px solid
        rgba(0, 190, 255, .35);

    overflow: hidden;

    box-shadow:
        0 15px 40px rgba(0,0,0,.38);

    transition:
        transform .4s ease,
        box-shadow .4s ease,
        border-color .4s ease;
}


/* Certificate image */

.certificate-card img {

    display: block;

    width: 100%;
    height: 100%;

    object-fit: contain;

    object-position: center;

    background: #ffffff;

    border-radius: 12px;

    position: relative;

    z-index: 2;

    transition:
        transform .45s ease;
}


/* ================================
   HOVER EFFECT
================================ */

.certificate-card:hover {

    transform:
        translateY(-10px)
        scale(1.02);

    border-color: #00d9ff;

    box-shadow:
        0 20px 50px rgba(0,0,0,.5),
        0 0 22px rgba(0,190,255,.55);
}

.certificate-card:hover img {
    transform: scale(1.025);
}


/* ================================
   MOVING BORDER
================================ */

.certificate-card::before {

    content: "";

    position: absolute;

    inset: 0;

    border-radius: 20px;

    border: 2px solid transparent;

    background:
        linear-gradient(
            120deg,
            transparent,
            rgba(0,220,255,.9),
            transparent
        ) border-box;

    mask:
        linear-gradient(#fff 0 0) padding-box,
        linear-gradient(#fff 0 0);

    mask-composite: exclude;

    -webkit-mask:
        linear-gradient(#fff 0 0) padding-box,
        linear-gradient(#fff 0 0);

    -webkit-mask-composite: xor;

    opacity: 0;

    z-index: 4;

    pointer-events: none;
}

.certificate-card:hover::before {

    opacity: 1;

    animation:
        borderMove 1.3s linear infinite;
}


/* ================================
   DIFFERENT HOVER COLORS
================================ */

.certificate-card:nth-child(1):hover {
    border-color: #00e5ff;

    box-shadow:
        0 20px 50px rgba(0,0,0,.5),
        0 0 25px rgba(0,229,255,.8);
}

.certificate-card:nth-child(2):hover {
    border-color: #ff3d68;

    box-shadow:
        0 20px 50px rgba(0,0,0,.5),
        0 0 25px rgba(255,61,104,.8);
}

.certificate-card:nth-child(3):hover {
    border-color: #ff9800;

    box-shadow:
        0 20px 50px rgba(0,0,0,.5),
        0 0 25px rgba(255,152,0,.8);
}

.certificate-card:nth-child(4):hover {
    border-color: #2196f3;

    box-shadow:
        0 20px 50px rgba(0,0,0,.5),
        0 0 25px rgba(33,150,243,.8);
}

.certificate-card:nth-child(5):hover {
    border-color: #9c5cff;

    box-shadow:
        0 20px 50px rgba(0,0,0,.5),
        0 0 25px rgba(156,92,255,.8);
}

.certificate-card:nth-child(6):hover {
    border-color: #00e676;

    box-shadow:
        0 20px 50px rgba(0,0,0,.5),
        0 0 25px rgba(0,230,118,.8);
}


/* ================================
   BACK BUTTON
================================ */

.back-home {

    display: block;

    width: fit-content;

    margin:
        0 auto
        65px;

    padding:
        13px 25px;

    color: white;

    text-decoration: none;

    font-weight: 700;

    border-radius: 11px;

    background:
        linear-gradient(
            135deg,
            #008cff,
            #7655ff
        );

    transition: .35s ease;
}

.back-home:hover {

    transform:
        translateY(-4px)
        scale(1.04);

    box-shadow:
        0 0 28px rgba(70,130,255,.55);
}


/* ================================
   ANIMATIONS
================================ */

@keyframes borderMove {

    0% {
        transform: rotate(0deg);
    }

    100% {
        transform: rotate(360deg);
    }
}

@keyframes titleMove {

    0% {
        background-position: 0%;
    }

    50% {
        background-position: 100%;
    }

    100% {
        background-position: 0%;
    }
}


/* ================================
   MOBILE
================================ */

@media (max-width: 850px) {

    .top-nav {
        justify-content: center;
        flex-wrap: wrap;
    }

    .top-nav a {
        font-size: 12px;
        padding: 8px 10px;
    }

    .certificate-grid {
        grid-template-columns: 1fr;
    }

    .certificate-card {
        height: 340px;
    }

    .page-header {
        padding-top: 45px;
    }

}

</style>
</head>

<script>

/* ================================
   SIMPLE 3 THEME SWITCH
================================ */

let theme = 0;

function changeTheme() {

    theme++;

    if (theme > 2) {
        theme = 0;
    }

    const themes = [

        `
        radial-gradient(circle at 10% 15%, rgba(0,180,255,.16), transparent 30%),
        radial-gradient(circle at 90% 75%, rgba(125,70,255,.18), transparent 35%),
        linear-gradient(135deg,#031526,#071b32,#10153b)
        `,

        `
        radial-gradient(circle at 10% 15%, rgba(0,255,180,.15), transparent 30%),
        radial-gradient(circle at 90% 75%, rgba(0,120,255,.18), transparent 35%),
        linear-gradient(135deg,#031c19,#063b39,#10284d)
        `,

        `
        radial-gradient(circle at 10% 15%, rgba(255,50,180,.15), transparent 30%),
        radial-gradient(circle at 90% 75%, rgba(120,50,255,.20), transparent 35%),
        linear-gradient(135deg,#21051f,#321052,#111a46)
        `
    ];

    document.body.style.background =
        themes[theme];

    localStorage.setItem(
        "certificateTheme",
        theme
    );
}


/* Load saved theme */

window.addEventListener(
    "DOMContentLoaded",
    function() {

        const saved =
            localStorage.getItem(
                "certificateTheme"
            );

        if (saved !== null) {

            theme = parseInt(saved);

            const themes = [

                `
                radial-gradient(circle at 10% 15%, rgba(0,180,255,.16), transparent 30%),
                radial-gradient(circle at 90% 75%, rgba(125,70,255,.18), transparent 35%),
                linear-gradient(135deg,#031526,#071b32,#10153b)
                `,

                `
                radial-gradient(circle at 10% 15%, rgba(0,255,180,.15), transparent 30%),
                radial-gradient(circle at 90% 75%, rgba(0,120,255,.18), transparent 35%),
                linear-gradient(135deg,#031c19,#063b39,#10284d)
                `,

                `
                radial-gradient(circle at 10% 15%, rgba(255,50,180,.15), transparent 30%),
                radial-gradient(circle at 90% 75%, rgba(120,50,255,.20), transparent 35%),
                linear-gradient(135deg,#21051f,#321052,#111a46)
                `
            ];

            document.body.style.background =
                themes[theme];
        }

    }
);

</script>
