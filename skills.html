<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Skills | Tanweer Ansari</title>

    <!-- Main Website CSS -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* ================================
           SKILLS PAGE
        ================================= */

        .skills-page {
            min-height: 100vh;
            padding: 110px 5% 70px;
            background: var(--bg, #061426);
        }

        .skills-header {
            max-width: 1200px;
            margin: 0 auto 45px;
        }

        .skills-label {
            color: #20a8ff;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .skills-header h1 {
            font-size: clamp(38px, 5vw, 62px);
            line-height: 1.1;
            margin: 0 0 15px;
            color: #ffffff;
        }

        .skills-header p {
            color: #9fb3c8;
            font-size: 18px;
            margin: 0;
        }

        /* ================================
           GRID
        ================================= */

        .skills-grid {
            max-width: 1200px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        /* ================================
           CARD
        ================================= */

        .skill-card {
            position: relative;
            padding: 30px;
            min-height: 260px;

            background: linear-gradient(
                145deg,
                rgba(14, 37, 64, 0.95),
                rgba(7, 24, 44, 0.98)
            );

            border: 1px solid rgba(55, 148, 255, 0.25);
            border-radius: 20px;

            transition:
                transform 0.35s ease,
                border-color 0.35s ease,
                box-shadow 0.35s ease,
                background 0.35s ease;

            overflow: hidden;
        }

        .skill-card::before {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            top: -100px;
            right: -80px;

            background: rgba(0, 174, 255, 0.15);
            border-radius: 50%;
            filter: blur(5px);

            transition: 0.4s ease;
        }

        .skill-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: #21a9ff;

            box-shadow:
                0 20px 45px rgba(0, 0, 0, 0.35),
                0 0 25px rgba(0, 157, 255, 0.18);

            background: linear-gradient(
                145deg,
                #102f50,
                #091d36
            );
        }

        .skill-card:hover::before {
            transform: scale(2);
            background: rgba(0, 174, 255, 0.12);
        }

        /* ================================
           ICON
        ================================= */

        .skill-icon {
            width: 52px;
            height: 52px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background: linear-gradient(
                135deg,
                #ff7a18,
                #ff3d81
            );

            color: white;
            font-size: 24px;

            margin-bottom: 20px;

            box-shadow: 0 10px 25px rgba(255, 80, 80, 0.25);
        }

        .skill-card h2 {
            color: #ffffff;
            font-size: 22px;
            margin: 0 0 18px;
        }

        .skill-card ul {
            padding: 0;
            margin: 0;
            list-style: none;
        }

        .skill-card li {
            position: relative;
            padding-left: 18px;
            margin: 9px 0;

            color: #aebfd1;
            font-size: 14px;
            line-height: 1.5;
        }

        .skill-card li::before {
            content: "•";

            position: absolute;
            left: 0;

            color: #ff8a00;
            font-size: 18px;
            font-weight: bold;
        }

        /* ================================
           HOBBIES CARD
        ================================= */

        .hobbies-card {
            grid-column: span 3;
            min-height: auto;
        }

        .hobbies-card li {
            margin: 10px 0;
        }

        /* ================================
           NAVIGATION
        ================================= */

        .skills-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999;

            height: 72px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;

            background: rgba(3, 15, 29, 0.92);
            backdrop-filter: blur(15px);

            border-bottom: 1px solid rgba(52, 153, 255, 0.2);
        }

        .skills-nav a {
            position: relative;

            color: #9fb3c8;
            text-decoration: none;

            font-size: 15px;
            font-weight: 700;

            padding: 10px 5px;

            transition: 0.3s ease;
        }

        .skills-nav a:hover {
            color: #ffffff;
            transform: translateY(-2px);
            text-shadow: 0 0 12px rgba(0, 174, 255, 0.8);
        }

        .skills-nav a::after {
            content: "";

            position: absolute;
            left: 0;
            bottom: 2px;

            width: 0;
            height: 2px;

            background: linear-gradient(
                90deg,
                #00aaff,
                #8b5cf6
            );

            transition: 0.3s ease;
        }

        .skills-nav a:hover::after {
            width: 100%;
        }

        /* ================================
           RESPONSIVE
        ================================= */

        @media (max-width: 950px) {

            .skills-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .hobbies-card {
                grid-column: span 2;
            }

            .skills-nav {
                gap: 15px;
            }

            .skills-nav a {
                font-size: 13px;
            }
        }

        @media (max-width: 650px) {

            .skills-page {
                padding: 100px 20px 50px;
            }

            .skills-grid {
                grid-template-columns: 1fr;
            }

            .hobbies-card {
                grid-column: span 1;
            }

            .skills-nav {
                overflow-x: auto;
                justify-content: flex-start;
                padding: 0 15px;
            }

            .skills-nav a {
                white-space: nowrap;
            }
        }
    </style>
</head>
