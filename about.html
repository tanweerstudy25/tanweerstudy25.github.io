<script>

/* =====================================================
   PROFESSIONAL ABOUT PAGE
   FAST LIVE WRITING + MOVING PEN
===================================================== */

document.addEventListener("DOMContentLoaded", function () {

    const hero =
        document.getElementById("aboutHero");

    const pen =
        document.getElementById("liveWritingPen");

    const thankYou =
        document.getElementById("profileThankYou");

    const writingElements =
        document.querySelectorAll(".live-write");


    if (!hero || !pen || !writingElements.length) {
        return;
    }


    /* -------------------------------------------------
       SAVE ORIGINAL CONTENT
    ------------------------------------------------- */

    const elements = [];


    writingElements.forEach(function (element) {

        /*
           For title we preserve the gradient span.
           For normal elements we use text.
        */

        if (element.tagName === "H1") {

            const gradient =
                element.querySelector(".gradient-text");

            const gradientText =
                gradient
                    ? gradient.textContent.trim()
                    : "";

            let normalText = "";

            element.childNodes.forEach(function (node) {

                if (node.nodeType === Node.TEXT_NODE) {

                    normalText +=
                        node.textContent;

                }

            });


            elements.push({

                element: element,

                type: "title",

                firstText:
                    normalText
                        .replace(/\s+/g, " ")
                        .trim(),

                gradientText:
                    gradientText,

                speed:
                    Number(
                        element.dataset.speed
                    ) || 20

            });

        }

        else {

            elements.push({

                element: element,

                type: "normal",

                text:
                    element.textContent
                        .replace(/\s+/g, " ")
                        .trim(),

                speed:
                    Number(
                        element.dataset.speed
                    ) || 10

            });

        }

    });



    /* -------------------------------------------------
       CLEAR TEXT BEFORE WRITING
    ------------------------------------------------- */

    elements.forEach(function (item) {

        if (item.type === "title") {

            item.element.innerHTML =
                '<span class="normal-title-part"></span> ' +
                '<span class="gradient-text"></span>';

        }

        else if (
            item.element.classList.contains("eyebrow")
        ) {

            item.element.innerHTML =
                '<i class="fa-solid fa-pen-nib"></i>' +
                '<span class="eyebrow-writing-text"></span>' +
                '<i class="fa-solid fa-pencil"></i>';

        }

        else {

            item.element.textContent =
                "";

        }

    });



  /* -------------------------------------------------
   MOVE PEN TO ACTUAL TYPED TEXT POSITION
------------------------------------------------- */

function movePen(target) {

    if (!target || !target.firstChild) {
        return;
    }

    const heroRect =
        hero.getBoundingClientRect();

    const range =
        document.createRange();

    range.selectNodeContents(target);

    range.collapse(false);

    const textRect =
        range.getBoundingClientRect();


    let x =
        textRect.right -
        heroRect.left;

    let y =
        textRect.bottom -
        heroRect.top;


    x =
        Math.max(
            15,
            Math.min(
                x,
                hero.clientWidth - 25
            )
        );


    pen.style.left =
        x + "px";

    pen.style.top =
        y + "px";

}  


    /* -------------------------------------------------
       TYPE NORMAL TEXT
    ------------------------------------------------- */

    function typeText(
        target,
        text,
        speed
    ) {

        return new Promise(function (resolve) {

            let index = 0;

            target.textContent =
                "";

            pen.classList.add(
                "is-writing"
            );


            function writeCharacter() {

                if (index < text.length) {

                    target.textContent +=
                        text.charAt(index);

                    index++;


                    /*
                       Move pen after every few letters.
                       Faster and smoother.
                    */

                    if (
                        index % 2 === 0 ||
                        text.charAt(index - 1) === " "
                    ) {

                        movePen(target);

                    }


                    setTimeout(
                        writeCharacter,
                        speed
                    );

                }

                else {

                    movePen(target);

                    setTimeout(
                        resolve,
                        100
                    );

                }

            }


            writeCharacter();

        });

    }



    /* -------------------------------------------------
       WRITE MAIN TITLE
    ------------------------------------------------- */

    async function writeTitle(item) {

        const normalPart =
            item.element.querySelector(
                ".normal-title-part"
            );

        const gradientPart =
            item.element.querySelector(
                ".gradient-text"
            );


        await typeText(

            normalPart,

            item.firstText,

            item.speed

        );


        await typeText(

            gradientPart,

            item.gradientText,

            item.speed

        );

    }



    /* -------------------------------------------------
       WRITE ABOUT ME EYEBROW
    ------------------------------------------------- */

    async function writeEyebrow(item) {

        const target =
            item.element.querySelector(
                ".eyebrow-writing-text"
            );


        await typeText(

            target,

            item.text,

            item.speed

        );

    }



    /* -------------------------------------------------
       START COMPLETE WRITING SEQUENCE
    ------------------------------------------------- */

    async function startWriting() {


        /*
           Small professional delay
        */

        await new Promise(function (resolve) {

            setTimeout(
                resolve,
                250
            );

        });



        for (
            let i = 0;
            i < elements.length;
            i++
        ) {

            const item =
                elements[i];


            if (item.type === "title") {

                await writeTitle(item);

            }

            else if (
                item.element.classList.contains(
                    "eyebrow"
                )
            ) {

                await writeEyebrow(item);

            }

            else {

                await typeText(

                    item.element,

                    item.text,

                    item.speed

                );

            }


            /*
               Very short pause between lines
            */

            await new Promise(function (resolve) {

                setTimeout(
                    resolve,
                    90
                );

            });

        }



        /* -------------------------------------------------
           WRITING FINISHED
        ------------------------------------------------- */

        pen.classList.remove(
            "is-writing"
        );


        pen.style.opacity =
            "0";


        /*
           Show professional thank-you message
        */

        setTimeout(function () {

            if (thankYou) {

                thankYou.classList.add(
                    "show"
                );

            }

        }, 250);

    }



    /* -------------------------------------------------
       RUN
    ------------------------------------------------- */

    startWriting();

});

</script>
